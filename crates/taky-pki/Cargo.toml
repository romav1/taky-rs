[package]
name = "taky-pki"
description = "taky-rs: cert-db, PEM/keys, rustls configs, PeerIdentity, certificate and PKCS#12 generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
taky-common.workspace = true
taky-config.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-native-certs.workspace = true
x509-parser.workspace = true
rcgen = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
pkcs8.workspace = true
der.workspace = true
des = { workspace = true, optional = true }
cbc = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2.workspace = true
hmac = { workspace = true, optional = true }
md-5.workspace = true
rand = { workspace = true, optional = true }
chrono.workspace = true
thiserror.workspace = true

[features]
# Certificate / key / PKCS#12 generation (make_ca, make_cert, pkcs12 writer). Enabled only by
# takyctl, so `rsa` (deny.toml RUSTSEC-2023-0071 exception) is not linked into taky-rs / taky_dps-rs
# (review-T-10 N-2). Build binaries per package (`-p`) to avoid workspace feature unification.
gen = ["dep:rcgen", "dep:rsa", "dep:des", "dep:cbc", "dep:aes", "dep:sha1", "dep:hmac", "dep:rand"]

[dev-dependencies]
p12-keystore.workspace = true

[lints]
workspace = true
