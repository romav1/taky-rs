[package]
name = "taky-pki"
description = "taky-rs: cert-db, PEM/keys, rustls configs, PeerIdentity, certificate and PKCS#12 generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
taky-common.workspace = true
taky-config.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-native-certs.workspace = true
x509-parser.workspace = true
rcgen = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
pkcs8.workspace = true
der.workspace = true
des.workspace = true
cbc.workspace = true
aes.workspace = true
sha1 = { workspace = true, optional = true }
sha2.workspace = true
hmac = { workspace = true, optional = true }
md-5.workspace = true
rand = { workspace = true, optional = true }
chrono.workspace = true
thiserror.workspace = true
nix.workspace = true

[features]
# Certificate / key / PKCS#12 generation (make_ca, make_cert, pkcs12 writer). Enabled only by
# takyctl, so `rsa` (deny.toml RUSTSEC-2023-0071 exception) is not linked into taky-rs / taky_dps-rs
# (review-T-10 N-2). Build binaries per package (`-p`) to avoid workspace feature unification.
# des/cbc/aes are always linked: legacy encrypted PEM keys (ADR-003); pkcs8 PBES2 pulls them anyway.
gen = ["dep:rcgen", "dep:rsa", "dep:sha1", "dep:hmac", "dep:rand"]

[dev-dependencies]
p12-keystore.workspace = true
# Test certificates are generated at test time (no keys in the repo).
rcgen.workspace = true
rsa.workspace = true
rand.workspace = true
tempfile.workspace = true
taky-common = { workspace = true, features = ["testkit"] }
serde_json.workspace = true

[lints]
workspace = true
