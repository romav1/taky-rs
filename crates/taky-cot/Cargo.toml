[package]
name = "taky-cot"
description = "taky-rs: CoT models, streaming decoder, Router, Persistence, CoT log (sans-IO core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
## qa01 test hooks: FakeClock, TestOutbox, Router::persist_snapshot/find_clients.
testkit = ["taky-common/testkit"]

[dependencies]
taky-common.workspace = true
taky-config.workspace = true
taky-xml.workspace = true
redis.workspace = true
bytes.workspace = true
chrono.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
taky-common = { workspace = true, features = ["testkit"] }
# Self dev-dependency: own tests always get `testkit` (plain `cargo test -p taky-cot` runs
# router/redis_live; ub01 P0-3). Dev-deps are not unified into normal builds (resolver 3).
taky-cot = { path = ".", features = ["testkit"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
