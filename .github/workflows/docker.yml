# taky-rs Docker image (ADR-007, T-12): linux/amd64, linux/arm64, linux/arm/v7 from musl binaries
# (no compiling under qemu). Pushed to GHCR ONLY on tags v*; other runs build and smoke-test only.
# Image: ghcr.io/<repository owner, lowercased>/taky-rs — derived from github context, no hard-coded owner.
# Every run also smoke-tests packaging/docker/compose.yaml exactly as its README describes it.
name: docker

on:
  push:
    tags: ["v*"]
    branches: ["main", "master"]
    paths:
      - "packaging/docker/**"
      - ".github/workflows/docker.yml"
      - "scripts/build-all.sh"
  pull_request:
    paths:
      - "packaging/docker/**"
      - ".github/workflows/docker.yml"
      - "scripts/build-all.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97"
  CARGO_TERM_COLOR: always
  ZIGLANG_VERSION: "0.17.0"
  CARGO_ZIGBUILD_VERSION: "0.24.0"

jobs:
  musl:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} + ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -t "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install zig + cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zig-venv"
          "$RUNNER_TEMP/zig-venv/bin/pip" install -q "ziglang==${ZIGLANG_VERSION}" "cargo-zigbuild==${CARGO_ZIGBUILD_VERSION}"
          echo "$RUNNER_TEMP/zig-venv/bin" >> "$GITHUB_PATH"
      - name: scripts/build-all.sh --strict ${{ matrix.target }}
        run: scripts/build-all.sh --strict "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.target }}
          path: dist/docker/
          if-no-files-found: error
          retention-days: 3

  image:
    name: buildx (amd64, arm64, arm/v7)
    needs: musl
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      # ADR-007 errata 4: base images must be pinned by digest before the first v* tag.
      - name: Base image digests (paste into the FROM lines / compose.yaml to pin)
        run: |
          for i in busybox:1.36.1-musl gcr.io/distroless/static-debian12:nonroot redis:7.2.7-alpine; do
            echo "$i@$(docker buildx imagetools inspect "$i" --format '{{json .Manifest}}' | jq -r .digest)"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release guard (FROM images pinned by digest)
        if: env.PUSH == 'true'
        run: |
          if grep -E '^FROM ' packaging/docker/Dockerfile | grep -v '@sha256:'; then
            echo "::error::pin the FROM images above by digest before a release tag (see the previous step)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-*
          path: dist/docker
          merge-multiple: true
      - name: Check build context
        run: |
          ls -lR dist/docker
          for a in amd64 arm64 armv7; do
            for b in taky-rs taky_dps-rs takyctl-rs LICENSE; do
              test -f "dist/docker/$a/$b" || { echo "::error::missing dist/docker/$a/$b"; exit 1; }
            done
          done
      - name: Image name (lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/taky-rs" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # Smoke test (every run): amd64 image loads, runs as non-root and answers --version.
      - name: Build amd64 for smoke test
        uses: docker/build-push-action@v6
        with:
          context: dist/docker
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: taky-rs:smoke
      - name: Smoke test
        run: |
          user="$(docker image inspect taky-rs:smoke --format '{{.Config.User}}')"
          echo "image user: $user"
          [[ "$user" == "65532:65532" ]] || { echo "::error::image must run as 65532:65532"; exit 1; }
          docker run --rm taky-rs:smoke taky-rs --version
          docker run --rm taky-rs:smoke taky_dps-rs --version
          docker run --rm taky-rs:smoke takyctl-rs --version
      - name: Image layout (only /etc/taky and /var/taky belong to 65532)
        run: |
          cid="$(docker create taky-rs:smoke)"
          docker export "$cid" | tar -tv --numeric-owner -f - \
            | awk '{n=$6; sub(/\/$/, "", n)} n ~ /^(etc|var|etc\/taky|var\/taky|usr\/local\/bin\/taky-rs)$/ {print $1, $2, n}' \
            | sort -k3 | tee layout.txt
          docker rm "$cid" >/dev/null
          for l in 'drwxr-x--- 65532/65532 etc/taky' 'drwxr-x--- 65532/65532 var/taky' \
                   '-rwxr-xr-x 0/0 usr/local/bin/taky-rs'; do
            grep -qxF -e "$l" layout.txt || { echo "::error::expected '$l'"; exit 1; }
          done
          [[ "$(awk '($3=="etc"||$3=="var") && $2=="0/0"' layout.txt | wc -l)" == 2 ]] \
            || { echo "::error::/etc and /var must stay root-owned"; exit 1; }
      - name: Compose smoke test (packaging/docker/README.md first run)
        env:
          TAKY_RS_IMAGE: taky-rs:smoke
        run: |
          set -euo pipefail
          dc() { docker compose -f packaging/docker/compose.yaml "$@"; }
          bb() { docker run --rm "$@"; }
          dc config -q
          dc run --rm -T --no-deps taky-rs takyctl-rs setup --host smoke --public-ip 127.0.0.1
          bb --user 65532:65532 -v taky-rs-etc:/etc/taky busybox:1.36.1-musl \
            sed -i 's|^redis$|redis = redis://redis:6379/0|' /etc/taky/taky.conf
          dc up -d --wait --wait-timeout 120
          dc exec -T taky-rs takyctl-rs status
          dc exec -T taky-rs takyctl-rs build_client JENNY
          dc cp taky-rs:/var/taky/JENNY.zip .
          unzip -l JENNY.zip
          dc exec -T taky-rs takyctl-rs build_client --dump_pem BOB
          mkdir -m 0777 out
          bb --user 65532:65532 -v taky-rs-etc:/etc/taky:ro -v taky-rs-var:/var/taky -v "$PWD/out":/out \
            busybox:1.36.1-musl sh -c 'cp /var/taky/BOB-*.crt /out/bob.crt && cp /var/taky/BOB-*.key /out/bob.key \
              && cp /etc/taky/ssl/ca.crt /out/ && rm /var/taky/JENNY.zip /var/taky/BOB*'
          curl -fsS --cacert out/ca.crt --cert out/bob.crt --key out/bob.key \
            --resolve smoke:8443:127.0.0.1 https://smoke:8443/Marti/api/version | tee version.txt
          grep -q '^taky-rs-' version.txt
          dc logs taky-rs | grep -F 'Connecting to redis://redis:6379/0'
          dc stop
          bb -v taky-rs-etc:/etc/taky:ro -v taky-rs-var:/var/taky:ro -v taky-rs-redis:/data:ro \
            -v "$PWD":/backup busybox:1.36.1-musl \
            sh -c 'umask 077; tar -czf /backup/taky-rs-backup.tar.gz -C / etc/taky var/taky data'
          tar -tzf taky-rs-backup.tar.gz | grep -qx 'etc/taky/ssl/ca.key'
      - name: Compose logs and cleanup
        if: always()
        env:
          TAKY_RS_IMAGE: taky-rs:smoke
        run: |
          docker compose -f packaging/docker/compose.yaml logs --no-color || true
          docker compose -f packaging/docker/compose.yaml down -v || true
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multi-arch${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: dist/docker
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
