# taky-rs nightly fuzzing (qa01, S-407; test-strategy §1.6, G-3 item 6 / ADR-010 B4-3).
# One job per cargo-fuzz target, 1 h each (workflow_dispatch can change it), corpus carried between runs in
# the Actions cache, so the CPU-hour thresholds of G-3 (≥ 4 CPU-h on cot_decoder_stream, parse_element,
# ini_parse; ≥ 1 CPU-h on the rest) accumulate night after night. Each job uploads its libFuzzer stats
# (fuzz-stats-<target>) — sum `stat::number_of_executed_units` / run time over the runs for the G-3 report.
# A crash/timeout/OOM fails the job and uploads the reproducer (fuzz-crash-<target>): minimize it, commit it to
# fuzz/corpus/regressions/<target>/ and send a bug message to the crate owner.
# The lxml differential (`tools/difftest/difftest fuzzdiff`) needs the Python original and runs in the office bench.
name: fuzz

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        default: "3600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: "0.13.2"

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - cot_decoder_stream
          - parse_element
          - serialize_roundtrip
          - ini_parse
          - isoparse
          - py_float
          - mgmt_frame
          - secure_filename
          - dps_multipart
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Build
        working-directory: fuzz
        run: cargo fuzz build -O -s none ${{ matrix.target }}
      - name: Replay regressions
        working-directory: fuzz
        run: |
          if [ -d "corpus/regressions/${{ matrix.target }}" ]; then
            cargo fuzz run -O -s none ${{ matrix.target }} corpus/regressions/${{ matrix.target }} -- \
              -runs=0 -rss_limit_mb=256 -malloc_limit_mb=64 -timeout=1 -close_fd_mask=1
          fi
      - name: Fuzz
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '3600' }}
        run: |
          mkdir -p artifacts/${{ matrix.target }}
          cargo fuzz run -O -s none ${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -rss_limit_mb=256 -malloc_limit_mb=64 -timeout=1 -close_fd_mask=1 \
            -max_total_time="$SECONDS_PER_TARGET" -print_final_stats=1 \
            -artifact_prefix=artifacts/${{ matrix.target }}/ 2>&1 | tee artifacts/${{ matrix.target }}.log | grep -E "INITED|DONE|ERROR|SUMMARY|stat::"
          exit "${PIPESTATUS[0]}"
      - name: Minimize corpus
        if: success()
        working-directory: fuzz
        run: |
          mkdir -p corpus/.min
          cargo fuzz run -O -s none ${{ matrix.target }} corpus/.min corpus/${{ matrix.target }} -- \
            -merge=1 -rss_limit_mb=256 -malloc_limit_mb=64 -timeout=1 -close_fd_mask=1 >/dev/null 2>&1
          rm -rf corpus/${{ matrix.target }} && mv corpus/.min corpus/${{ matrix.target }}
          echo "corpus: $(ls corpus/${{ matrix.target }} | wc -l) files" | tee -a artifacts/${{ matrix.target }}.log
      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.target }}"
            grep -E "stat::|corpus:" fuzz/artifacts/${{ matrix.target }}.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-stats-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}.log
          retention-days: 90
      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
