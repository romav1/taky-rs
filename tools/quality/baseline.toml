# ub-mode quality baseline (S-805). Gate: scripts/check.sh --ub fails when a count RISES.
# Lower the counts when offenders are fixed: tools/quality/ub.sh --write-baseline (see README.md).
# crap_ge_10: functions with CRAP >= 10 (crapper, tarpaulin LCOV), [exceptions] not counted.
# dryer_pairs: dryer --threshold 0.8 pairs (defaults --min-lines 4 --min-nodes 20).
# Also failing: an offender not in [known]; a [known.crap] score rising by > score_tolerance
# (absorbs ptrace coverage noise).
crap_ge_10 = 101
dryer_pairs = 11
score_tolerance = 0.5

# Accepted exceptions (ub01 §6): Python lookup tables written as `match`; by
# crapper key `namespace::name`. Control-flow functions get no exemption.
[exceptions]
crap = [
  "taky_config::error::IniError::fmt",
  "taky_config::error::IniError::py_class",
  "taky_cot::models::Teams::as_str",
]

# Offenders at baseline time: CRAP key = score; dryer pair keys.
[known]
dryer = [
  "crates/taky-cot/src/models.rs::is_takuser <-> crates/taky-cot/src/models.rs::is_geochat",
  "crates/taky-dps/src/cli.rs::command <-> crates/taky-server/src/cli.rs::command",
  "crates/taky-dps/src/cli.rs::command <-> crates/takyctl/src/cli.rs::command",
  "crates/taky-dps/src/cli.rs::try_parse_from <-> crates/taky-server/src/cli.rs::try_parse_from",
  "crates/taky-dps/src/cli.rs::try_parse_from <-> crates/takyctl/src/cli.rs::try_parse_from",
  "crates/taky-dps/src/werkzeug.rs::is_param_char <-> crates/taky-dps/src/werkzeug.rs::is_charset_char",
  "crates/taky-pki/src/certgen.rs::fmt <-> crates/taky-pki/src/certgen.rs::fmt",
  "crates/taky-pki/src/certgen.rs::tlv <-> crates/taky-pki/src/pkcs12.rs::tlv",
  "crates/taky-server/src/cli.rs::command <-> crates/takyctl/src/cli.rs::command",
  "crates/taky-server/src/cli.rs::try_parse_from <-> crates/takyctl/src/cli.rs::try_parse_from",
  "crates/takyctl/src/systemd.rs::cot_unit <-> crates/takyctl/src/systemd.rs::dps_unit",
]

