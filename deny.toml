# cargo-deny policy (ARCHITECTURE §16.3). Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # rsa: Marvin attack — timing side channel on RSA *decryption*. taky-rs never decrypts with
    # RSA; rsa is used only by takyctl-rs to generate keys and sign certificates offline.
    # Exception reviewed by arch01 (ARCHITECTURE §16.3).
    { id = "RUSTSEC-2023-0071", reason = "rsa used only for offline key generation/signing in takyctl, no decryption" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.9
# Licenses in the allow list that no current dependency uses are fine (the list is policy).
unused-allowed-license = "allow"

[[licenses.clarify]]
# ring (policy §16.3): its LICENSE combines several texts (Apache-2.0 + ISC parts from BoringSSL).
# ring 0.17.14 declares `license = "Apache-2.0 AND ISC"` in Cargo.toml, which cargo-deny uses first,
# so this clarification is a safety net for releases without usable metadata. The hash is the
# CRC32 of ring-0.17.14/LICENSE; on a ring upgrade with a changed LICENSE, update it.
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0x96476bb3 }]

[licenses.private]
# Workspace crates are publish = false.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # No OpenSSL (ARCHITECTURE §0.5).
    { crate = "openssl-sys" },
    # TLS backend is ring only.
    { crate = "aws-lc-sys" },
    # Trust roots come from the system store / own CA, never bundled Mozilla roots.
    { crate = "webpki-roots" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
